<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Comandas Delivery</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.85em%22 font-size=%2290%22>🛵</text></svg>">
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0d9488" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Comandas Delivery" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  /* ===== THEME VARIABLES ===== */
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f9fafb; --surface-3: #f1f3f6;
    --border: #edeff3; --border-2: #e2e5ec;
    --text: #14181f; --text-2: #4b5262; --text-3: #8a91a0;
    --accent: #0d9488; --accent-2: #0b7a70; --accent-light: #f0fdfa;
    --danger: #ef4444; --danger-light: #fef2f2;
    --success: #067647; --success-light: #ecfdf5;
    --warning: #f59e0b; --warning-light: #fffbeb;
    --shadow-sm: 0 1px 2px rgba(20,24,31,0.04);
    --shadow-md: 0 4px 12px rgba(20,24,31,0.06);
    --shadow-lg: 0 8px 24px rgba(20,24,31,0.08);
    --radius: 16px; --radius-sm: 10px; --radius-xs: 9px;
    --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  }
  [data-theme="dark"] {
    --bg: #0f1117; --surface: #1a1d27; --surface-2: #222632; --surface-3: #2a2e3c;
    --border: #2a2e3c; --border-2: #363a48;
    --text: #f0f1f5; --text-2: #b0b5c3; --text-3: #7a7f90;
    --accent: #14b8a6; --accent-2: #0d9488; --accent-light: rgba(20,184,166,0.1);
    --danger: #f87171; --danger-light: rgba(248,113,113,0.1);
    --success: #34d399; --success-light: rgba(52,211,153,0.1);
    --warning: #fbbf24; --warning-light: rgba(251,191,36,0.1);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); transition: background var(--transition); }
  body {
    font-family: 'Inter', -apple-system, sans-serif; color: var(--text);
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
    transition: color var(--transition);
  }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }
  input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  #app { min-height: 100vh; padding-bottom: 32px; }

  /* ===== HEADER ===== */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10; transition: background var(--transition), border-color var(--transition);
    box-shadow: var(--shadow-sm);
  }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo-mark {
    width: 38px; height: 38px; border-radius: 11px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(13,148,136,0.25);
  }
  .brand-block { min-width: 0; }
  .brand { font-weight: 800; font-size: 15.5px; letter-spacing: -0.01em; line-height: 1.15; }
  .brand-sub { font-size: 11.5px; color: var(--text-3); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .header-right { display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: var(--radius-xs); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all var(--transition);
  }
  .icon-btn:active { background: var(--surface-3); transform: scale(0.95); }

  /* ===== TAB BAR ===== */
  .tabbar {
    display: flex; background: var(--surface); border-top: 1px solid var(--border);
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    padding-bottom: env(safe-area-inset-bottom); transition: background var(--transition), border-color var(--transition);
  }
  .tab {
    flex: 1; border: none; background: transparent; color: var(--text-3);
    font-size: 11.5px; font-weight: 600; padding: 10px 0 8px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; transition: color var(--transition);
  }
  .tab .tab-icon { font-size: 19px; transition: transform var(--transition); }
  .tab.active { color: var(--accent); }
  .tab.active .tab-icon { transform: scale(1.15); }

  /* ===== MAIN ===== */
  main { max-width: 480px; margin: 0 auto; padding: 16px 14px 84px; }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes toastOut { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -10px); } }

  .animate-in { animation: fadeIn var(--transition) ease-out; }
  .animate-scale { animation: scaleIn var(--transition) ease-out; }

  /* ===== DAY NAV ===== */
  .day-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; animation: fadeIn var(--transition) ease-out; }
  .nav-btn {
    width: 38px; height: 38px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 18px;
    transition: all var(--transition); box-shadow: var(--shadow-sm);
  }
  .nav-btn:active { background: var(--surface-3); transform: scale(0.92); }
  .nav-btn.today-btn { width: auto; padding: 0 14px; font-size: 12px; font-weight: 700; color: var(--accent); border-color: var(--accent); }
  .day-nav-label { text-align: center; }
  .day-nav-date { font-weight: 700; font-size: 15.5px; text-transform: capitalize; }
  .day-nav-date.is-today { color: var(--accent); }
  .date-input { background: transparent; border: none; color: var(--text-3); font-size: 11px; margin-top: 2px; cursor: pointer; }
  .month-label { font-weight: 700; font-size: 16.5px; text-transform: capitalize; }

  /* ===== CARD ===== */
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px 14px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: background var(--transition), border-color var(--transition); }
  .list-header {
    display: grid; grid-template-columns: 1fr 1fr 34px 30px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-3);
    text-transform: uppercase; padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .empty-row { font-size: 13px; color: var(--text-3); text-align: center; padding: 28px 8px; }
  .empty-row .empty-icon { font-size: 36px; display: block; margin-bottom: 8px; opacity: 0.4; }

  /* ===== ENTRY ROW ===== */
  .entry-row { display: grid; grid-template-columns: 1fr 1fr 34px 30px; gap: 8px; align-items: center; padding: 6px 0; animation: slideIn 0.15s ease-out; }
  .entry-row.conferido { opacity: 0.45; }
  .comanda-field {
    border: 1px solid var(--border-2); border-radius: var(--radius-xs); padding: 9px 10px;
    font-size: 14px; font-weight: 600; background: var(--surface-2); color: var(--text); width: 100%;
    transition: all var(--transition);
  }
  .comanda-field:focus, .taxa-wrap:focus-within, .auth-input:focus, #arrancada-input:focus, .note-field:focus {
    outline: none; border-color: var(--accent); background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-light);
  }
  .comanda-field.riscado { text-decoration: line-through; }
  .taxa-wrap { display: flex; align-items: center; border: 1px solid var(--border-2); border-radius: var(--radius-xs); background: var(--surface-2); overflow: hidden; transition: all var(--transition); }
  .taxa-prefix { font-size: 12px; color: var(--text-3); padding: 0 0 0 10px; }
  .taxa-field {
    border: none; outline: none; padding: 9px 10px 9px 4px;
    font-size: 14px; font-weight: 600; background: transparent; color: var(--text); width: 100%;
  }
  .check-wrap { display: flex; align-items: center; justify-content: center; }
  .check-wrap input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
  .remove-btn { border: none; background: transparent; color: var(--danger); display: flex; align-items: center; justify-content: center; padding: 6px; font-size: 15px; transition: transform var(--transition); border-radius: 6px; }
  .remove-btn:active { transform: scale(1.3); }

  /* ===== NOTE EXPAND ===== */
  .entry-row.has-note { grid-template-rows: auto 0; }
  .entry-row.has-note.expanded { grid-template-rows: auto auto; }
  .note-cell { grid-column: 1 / -1; overflow: hidden; transition: all 0.2s ease; }
  .entry-row:not(.expanded) .note-cell { max-height: 0; padding: 0; opacity: 0; }
  .entry-row.expanded .note-cell { max-height: 60px; padding: 4px 0; opacity: 1; }
  .note-field {
    width: 100%; border: 1px solid var(--border-2); border-radius: var(--radius-xs); padding: 7px 10px;
    font-size: 12px; background: var(--surface-2); color: var(--text-2); transition: all var(--transition);
  }
  .note-toggle { font-size: 10px; color: var(--text-3); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .note-toggle:active { background: var(--surface-3); }
  .note-toggle.has-note { color: var(--accent); }

  /* ===== BUTTONS ===== */
  .add-btn {
    margin-top: 8px; width: 100%; border: 1.5px dashed var(--border-2); background: transparent;
    color: var(--accent); font-weight: 700; font-size: 13px; padding: 12px 0; border-radius: var(--radius-sm);
    transition: all var(--transition);
  }
  .add-btn:active { background: var(--accent-light); transform: scale(0.98); }
  .dup-btn {
    margin-top: 6px; width: 100%; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-2); font-weight: 600; font-size: 12px; padding: 10px 0; border-radius: var(--radius-sm);
    transition: all var(--transition);
  }
  .dup-btn:active { background: var(--surface-3); transform: scale(0.98); }
  .dup-btn:disabled { opacity: 0.4; }
  .divider { border-top: 1px solid var(--border); margin: 16px 0 12px; }

  /* ===== ARRANCADA ===== */
  .arrancada-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .arrancada-label { font-size: 13px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .arrancada-label .badge-info { font-size: 10px; font-weight: 700; color: var(--text-3); background: var(--surface-3); padding: 2px 6px; border-radius: 6px; }

  /* ===== SUMMARY ===== */
  .summary-block { border-top: 1px solid var(--border); padding-top: 10px; }
  .summary-line { display: flex; justify-content: space-between; font-size: 13.5px; padding: 5px 0; color: var(--text-2); }
  .summary-strong { font-weight: 700; color: var(--text); }
  .summary-total { margin-top: 6px; padding-top: 10px; border-top: 1.5px solid var(--text); font-size: 16px; font-weight: 800; color: var(--text); }

  /* ===== PROGRESS BAR ===== */
  .progress-wrap { margin: 8px 0 4px; }
  .progress-bar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .progress-fill.complete { background: var(--success); }
  .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 4px; }

  /* ===== SAVING ===== */
  .saving-note { text-align: center; font-size: 11px; color: var(--text-3); margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .saving-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; }

  /* ===== BIG STATS ===== */
  .big-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .big-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 14px; box-shadow: var(--shadow-sm); transition: all var(--transition); animation: scaleIn var(--transition) ease-out; }
  .big-stat:active { transform: scale(0.97); }
  .big-stat-value { font-size: 25px; font-weight: 800; color: var(--accent); }
  .big-stat-label { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }

  /* ===== CHART ===== */
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 14px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
  .chart-title { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px; }
  .chart-bars { display: flex; align-items: flex-end; gap: 2px; height: 120px; padding-bottom: 18px; position: relative; }
  .chart-bar { flex: 1; min-width: 0; border-radius: 3px 3px 0 0; background: var(--accent); opacity: 0.3; transition: all 0.3s ease; position: relative; cursor: pointer; min-height: 2px; }
  .chart-bar:hover, .chart-bar.has-data { opacity: 1; }
  .chart-bar.has-data { background: var(--accent); }
  .chart-bar.today { background: var(--warning); opacity: 1; box-shadow: 0 0 8px rgba(245,158,11,0.4); }
  .chart-bar .chart-tooltip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--surface); font-size: 10px; font-weight: 600; padding: 4px 8px; border-radius: 6px; white-space: nowrap; margin-bottom: 4px; z-index: 5; }
  .chart-bar:hover .chart-tooltip { display: block; }
  .chart-labels { display: flex; gap: 2px; font-size: 8px; color: var(--text-3); }
  .chart-labels span { flex: 1; text-align: center; min-width: 0; }

  /* ===== DAY LIST ===== */
  .day-list-title { font-size: 12px; color: var(--text-3); margin: 18px 4px 8px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
  .day-list { display: flex; flex-direction: column; gap: 6px; }
  .day-list-item {
    display: grid; grid-template-columns: 1.15fr 1fr 1fr; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px; color: var(--text); text-align: left; width: 100%;
    transition: all var(--transition); box-shadow: var(--shadow-sm); animation: slideIn 0.15s ease-out;
  }
  .day-list-item:active { background: var(--surface-3); transform: scale(0.98); }
  .day-list-item.is-today { border-color: var(--accent); border-width: 1.5px; }
  .day-list-date { font-size: 13px; font-weight: 700; text-transform: capitalize; }
  .day-list-entregas { font-size: 12px; color: var(--text-3); }
  .day-list-total { font-size: 13px; font-weight: 700; color: var(--accent); text-align: right; }
  .today-badge { display: inline-block; font-size: 8px; font-weight: 700; color: var(--accent); background: var(--accent-light); padding: 1px 5px; border-radius: 4px; margin-left: 4px; text-transform: uppercase; vertical-align: middle; }

  /* ===== SEARCH ===== */
  .search-wrap { margin-bottom: 10px; display: flex; gap: 8px; }
  .search-input {
    flex: 1; border: 1px solid var(--border-2); border-radius: var(--radius-xs); padding: 9px 12px;
    font-size: 13px; background: var(--surface-2); color: var(--text); transition: all var(--transition);
  }
  .search-input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-light); }
  .search-clear { border: 1px solid var(--border-2); background: var(--surface); color: var(--text-3); border-radius: var(--radius-xs); padding: 0 10px; font-size: 13px; transition: all var(--transition); }
  .search-clear:active { background: var(--surface-3); }

  /* ===== TOAST ===== */
  .toast-container { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; }
  .toast {
    background: var(--text); color: var(--surface); font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 12px; box-shadow: var(--shadow-lg); margin-top: 8px;
    animation: toastIn 0.25s ease-out; pointer-events: auto; display: flex; align-items: center; gap: 8px;
    max-width: 320px;
  }
  .toast.toast-out { animation: toastOut 0.25s ease-out forwards; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  /* ===== LOADING / AUTH ===== */
  .loading-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-3); font-size: 14px; gap: 12px; }
  .loading-screen .logo-mark { width: 56px; height: 56px; border-radius: 16px; }
  .loading-spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .auth-screen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); transition: background var(--transition);
  }
  .auth-card {
    background: var(--surface); border-radius: 20px; padding: 32px 24px;
    width: 100%; max-width: 340px; box-shadow: var(--shadow-lg);
    border: 1px solid var(--border); transition: all var(--transition);
    display: flex; flex-direction: column; align-items: center; animation: scaleIn 0.3s ease-out;
  }
  .auth-logo {
    width: 56px; height: 56px; border-radius: 16px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(13,148,136,0.3);
  }
  .auth-brand { font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
  .auth-sub { font-size: 13px; color: var(--text-3); margin-top: 3px; margin-bottom: 20px; }
  .auth-error {
    background: var(--danger-light); color: var(--danger); font-size: 12.5px; padding: 9px 12px;
    border-radius: var(--radius-xs); width: 100%; margin-bottom: 12px; text-align: center;
    animation: scaleIn 0.2s ease-out;
  }
  .auth-input {
    width: 100%; border: 1px solid var(--border-2); border-radius: var(--radius-sm); padding: 12px 13px;
    font-size: 14px; margin-bottom: 10px; background: var(--surface-2); color: var(--text); transition: all var(--transition);
  }
  .auth-submit {
    width: 100%; border: none; border-radius: var(--radius-sm); padding: 13px 0; background: var(--accent);
    color: #ffffff; font-weight: 700; font-size: 14px; margin-top: 4px; transition: all var(--transition);
    box-shadow: 0 4px 12px rgba(13,148,136,0.25);
  }
  .auth-submit:active { background: var(--accent-2); transform: scale(0.98); }
  .auth-switch { width: 100%; border: none; background: transparent; color: var(--accent); font-size: 12.5px; margin-top: 14px; font-weight: 600; }
  .auth-note { max-width: 300px; text-align: center; font-size: 11px; color: var(--text-3); margin-top: 18px; line-height: 1.5; }
  .auth-theme-toggle { position: fixed; top: 16px; right: 16px; z-index: 20; }

  /* ===== ACTION SHEET ===== */
  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 50; animation: fadeIn 0.2s ease; }
  .sheet { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 16px 32px; z-index: 51; box-shadow: var(--shadow-lg); animation: slideUp 0.25s ease-out; max-width: 480px; margin: 0 auto; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border-2); margin: 0 auto 16px; }
  .sheet-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }
  .sheet-btn { width: 100%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: var(--radius-sm); padding: 14px 16px; font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; transition: all var(--transition); }
  .sheet-btn:active { background: var(--surface-3); transform: scale(0.98); }
  .sheet-btn.danger { color: var(--danger); }
  .sheet-btn .sheet-icon { font-size: 18px; }
  .sheet-cancel { width: 100%; border: none; background: transparent; color: var(--text-3); font-size: 13px; font-weight: 600; margin-top: 8px; padding: 10px; }
</style>
</head>
<body>
<div id="app"><div class="loading-screen"><div class="logo-mark">🛵</div><div class="loading-spinner"></div></div></div>
<div class="toast-container" id="toast-container"></div>
<input type="file" id="import-file" accept=".json" style="display:none" />

<script>
(function () {
  "use strict";

  var MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  var WEEKDAYS_PT = ["dom","seg","ter","qua","qui","sex","sáb"];
  var GLOBAL_PREFIX = "comandasdelivery:";
  var currentUser = null;

  /* ===== STORAGE ===== */
  function dataPrefix() { return GLOBAL_PREFIX + "user:" + currentUser + ":"; }
  function storeGet(key) {
    try { var raw = localStorage.getItem(dataPrefix() + key); return raw === null ? null : raw; }
    catch (e) { return null; }
  }
  function storeSet(key, value) {
    try { localStorage.setItem(dataPrefix() + key, value); return true; }
    catch (e) { return false; }
  }
  function globalGet(key) { try { return localStorage.getItem(GLOBAL_PREFIX + key); } catch (e) { return null; } }
  function globalSet(key, value) { try { localStorage.setItem(GLOBAL_PREFIX + key, value); return true; } catch (e) { return false; } }

  /* ===== AUTH ===== */
  function simpleHash(str) {
    var hash = 0;
    for (var i = 0; i < str.length; i++) { hash = (Math.imul(31, hash) + str.charCodeAt(i)) | 0; }
    return String(hash);
  }
  function loadUsers() {
    try { var raw = localStorage.getItem(GLOBAL_PREFIX + "auth:users"); return raw ? JSON.parse(raw) : {}; }
    catch (e) { return {}; }
  }
  function saveUsers(users) { localStorage.setItem(GLOBAL_PREFIX + "auth:users", JSON.stringify(users)); }
  function normalizeUsername(u) { return (u || "").trim().toLowerCase(); }
  function registerUser(username, password) {
    var u = normalizeUsername(username);
    if (!u || !password) return { ok: false, msg: "Preencha usuário e senha." };
    if (u.length < 3) return { ok: false, msg: "Usuário deve ter ao menos 3 caracteres." };
    if (password.length < 4) return { ok: false, msg: "Senha deve ter ao menos 4 caracteres." };
    var users = loadUsers();
    if (users[u]) return { ok: false, msg: "Esse usuário já existe." };
    users[u] = { passwordHash: simpleHash(password), createdAt: new Date().toISOString() };
    saveUsers(users);
    return { ok: true };
  }
  function verifyLogin(username, password) {
    var u = normalizeUsername(username);
    var users = loadUsers();
    if (!users[u]) return { ok: false, msg: "Usuário não encontrado." };
    if (users[u].passwordHash !== simpleHash(password)) return { ok: false, msg: "Senha incorreta." };
    return { ok: true, username: u };
  }
  function getSession() { try { return localStorage.getItem(GLOBAL_PREFIX + "auth:session"); } catch (e) { return null; } }
  function setSession(username) { localStorage.setItem(GLOBAL_PREFIX + "auth:session", username); }
  function clearSession() { localStorage.removeItem(GLOBAL_PREFIX + "auth:session"); }

  /* ===== THEME ===== */
  function getTheme() { return globalGet("theme") || "light"; }
  function setTheme(t) { globalSet("theme", t); document.documentElement.setAttribute("data-theme", t); updateMetaThemeColor(t); }
  function toggleTheme() { setTheme(getTheme() === "dark" ? "light" : "dark"); render(); }
  function updateMetaThemeColor(t) {
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = t === "dark" ? "#0f1117" : "#0d9488";
  }

  /* ===== TOAST ===== */
  var toastTimeout = null;
  function showToast(msg, type) {
    var container = document.getElementById("toast-container");
    if (!container) return;
    // remove existing
    container.innerHTML = "";
    var toast = document.createElement("div");
    toast.className = "toast" + (type ? " " + type : "");
    var icon = type === "success" ? "✓" : type === "error" ? "✕" : "ℹ";
    toast.innerHTML = '<span>' + icon + '</span><span>' + esc(msg) + '</span>';
    container.appendChild(toast);
    if (toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function () {
      toast.classList.add("toast-out");
      setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 250);
    }, 2500);
  }

  /* ===== HELPERS ===== */
  function todayKey() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmtBRL(n) { n = n || 0; return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
  function fmtDateLabel(key) {
    var parts = key.split("-").map(Number);
    var dt = new Date(parts[0], parts[1] - 1, parts[2]);
    return pad(parts[2]) + "/" + pad(parts[1]) + " · " + WEEKDAYS_PT[dt.getDay()];
  }
  function fmtDateFull(key) {
    var parts = key.split("-").map(Number);
    var dt = new Date(parts[0], parts[1] - 1, parts[2]);
    return dt.getDate() + " de " + MONTHS_PT[dt.getMonth()].toLowerCase();
  }
  function emptyDay(dateKey) { return { dateKey: dateKey, entries: [], arrancada: 60 }; }
  function esc(s) { if (s === undefined || s === null) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  /* ===== STATE ===== */
  var state = {
    dayIndex: [],
    selectedKey: todayKey(),
    dayData: emptyDay(todayKey()),
    view: "day",
    monthCursor: (function () { var d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })(),
    monthDays: {},
    saving: false,
    error: null,
    isFullscreen: false,
    searchQuery: "",
    expandedNotes: {},
    showSheet: false
  };

  /* ===== DAY CRUD ===== */
  function loadDayIndex() { var raw = storeGet("day-index"); return raw ? JSON.parse(raw) : []; }
  function saveDayIndex(keys) { storeSet("day-index", JSON.stringify(keys)); }
  function loadDay(key) { var raw = storeGet("day:" + key); return raw ? JSON.parse(raw) : emptyDay(key); }
  function saveDay(data, silent) {
    if (!silent) { state.saving = true; }
    storeSet("day:" + data.dateKey, JSON.stringify(data));
    if (state.dayIndex.indexOf(data.dateKey) === -1) {
      state.dayIndex.push(data.dateKey);
      state.dayIndex.sort();
      saveDayIndex(state.dayIndex);
    }
    state.saving = false;
    if (!silent) { render(); }
  }
  function saveDayDebounced(data) {
    state.saving = true;
    if (data._saveTimer) clearTimeout(data._saveTimer);
    data._saveTimer = setTimeout(function () {
      storeSet("day:" + data.dateKey, JSON.stringify(data));
      if (state.dayIndex.indexOf(data.dateKey) === -1) {
        state.dayIndex.push(data.dateKey);
        state.dayIndex.sort();
        saveDayIndex(state.dayIndex);
      }
      state.saving = false;
      render();
    }, 400);
  }

  /* ===== INIT ===== */
  function init() {
    setTheme(getTheme());
    var session = getSession();
    if (session) { currentUser = session; startApp(); }
    else { renderLogin(); }
  }
  function startApp() {
    state.dayIndex = loadDayIndex();
    state.dayData = loadDay(state.selectedKey);
    render();
  }
  function logout() {
    clearSession();
    currentUser = null;
    authState.mode = "login";
    authState.error = null;
    renderLogin();
  }

  var authState = { mode: "login", error: null };

  /* ===== RENDER LOGIN ===== */
  function renderLogin() {
    var app = document.getElementById("app");
    var isRegister = authState.mode === "register";
    var themeIcon = getTheme() === "dark" ? "☀️" : "🌙";
    var html = '';
    html += '<button class="icon-btn auth-theme-toggle" data-action="toggle-theme">' + themeIcon + '</button>';
    html += '<div class="auth-screen"><div class="auth-card">';
    html += '  <div class="auth-logo">🛵</div>';
    html += '  <div class="auth-brand">Comandas Delivery</div>';
    html += '  <div class="auth-sub">' + (isRegister ? "Criar novo usuário" : "Entrar na sua conta") + '</div>';
    if (authState.error) html += '  <div class="auth-error">' + esc(authState.error) + '</div>';
    html += '  <input class="auth-input" id="auth-username" type="text" placeholder="Usuário" autocomplete="username" />';
    html += '  <input class="auth-input" id="auth-password" type="password" placeholder="Senha" autocomplete="' + (isRegister ? "new-password" : "current-password") + '" />';
    html += '  <button class="auth-submit" data-action="auth-submit">' + (isRegister ? "Criar conta" : "Entrar") + '</button>';
    html += '  <button class="auth-switch" data-action="auth-switch">' + (isRegister ? "Já tem conta? Entrar" : "Não tem conta? Criar agora") + '</button>';
    html += '</div>';
    html += '<div class="auth-note">Login local a este dispositivo — cada pessoa usa seu próprio usuário e senha para manter os lançamentos separados.</div>';
    html += '</div>';
    app.innerHTML = html;

    var userInput = document.getElementById("auth-username");
    var passInput = document.getElementById("auth-password");

    function submit() {
      var u = userInput.value, p = passInput.value;
      if (isRegister) {
        var r = registerUser(u, p);
        if (!r.ok) { authState.error = r.msg; renderLogin(); return; }
        currentUser = normalizeUsername(u);
        setSession(currentUser);
        authState.error = null;
        startApp();
        showToast("Conta criada com sucesso!", "success");
      } else {
        var res = verifyLogin(u, p);
        if (!res.ok) { authState.error = res.msg; renderLogin(); return; }
        currentUser = res.username;
        setSession(currentUser);
        authState.error = null;
        startApp();
      }
    }
    app.querySelector('[data-action="auth-submit"]').onclick = submit;
    app.querySelector('[data-action="auth-switch"]').onclick = function () {
      authState.mode = isRegister ? "login" : "register";
      authState.error = null;
      renderLogin();
    };
    app.querySelector('[data-action="toggle-theme"]').onclick = toggleTheme;
    [userInput, passInput].forEach(function (el) { el.onkeydown = function (ev) { if (ev.key === "Enter") submit(); }; });
    userInput.focus();
  }

  /* ===== ACTIONS ===== */
  function selectDay(key) { state.selectedKey = key; state.dayData = loadDay(key); state.searchQuery = ""; state.expandedNotes = {}; render(); }
  function addEntry() {
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    state.dayData.entries.push({ id: id, comanda: "", taxa: "", conferido: false, nota: "" });
    saveDay(state.dayData); render();
    // focus new input
    setTimeout(function () {
      var rows = document.querySelectorAll(".entry-row");
      if (rows.length) { var inp = rows[rows.length - 1].querySelector(".comanda-field"); if (inp) inp.focus(); }
    }, 50);
  }
  function updateEntry(id, field, value) {
    state.dayData.entries = state.dayData.entries.map(function (e) {
      if (e.id !== id) return e;
      var copy = Object.assign({}, e); copy[field] = value; return copy;
    });
    saveDayDebounced(state.dayData);
    // update summary without full re-render to keep focus
    updateSummaryLive();
  }
  function removeEntry(id) {
    state.dayData.entries = state.dayData.entries.filter(function (e) { return e.id !== id; });
    saveDay(state.dayData); render();
    showToast("Comanda removida");
  }
  function setArrancada(value) { state.dayData.arrancada = value; saveDayDebounced(state.dayData); updateSummaryLive(); }
  function toggleNote(id) { state.expandedNotes[id] = !state.expandedNotes[id]; render(); }

  function duplicateYesterday() {
    var parts = state.selectedKey.split("-").map(Number);
    var dt = new Date(parts[0], parts[1] - 1, parts[2] - 1);
    var prevKey = dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate());
    var prevDay = loadDay(prevKey);
    if (!prevDay.entries.length) { showToast("Nenhuma comanda no dia anterior", "error"); return; }
    prevDay.entries.forEach(function (e) {
      state.dayData.entries.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), comanda: e.comanda, taxa: "", conferido: false, nota: "" });
    });
    saveDay(state.dayData); render();
    showToast(prevDay.entries.length + " comandas copiadas de " + fmtDateLabel(prevKey), "success");
  }

  function markAllConferido() {
    if (!state.dayData.entries.length) return;
    var allDone = state.dayData.entries.every(function (e) { return e.conferido; });
    state.dayData.entries = state.dayData.entries.map(function (e) { var c = Object.assign({}, e); c.conferido = !allDone; return c; });
    saveDay(state.dayData); render();
    showToast(allDone ? "Todas desmarcadas" : "Todas conferidas ✓", "success");
  }

  function shiftDay(dir) {
    var parts = state.selectedKey.split("-").map(Number);
    var dt = new Date(parts[0], parts[1] - 1, parts[2] + dir);
    selectDay(dt.getFullYear() + "-" + pad(dt.getMonth() + 1) + "-" + pad(dt.getDate()));
  }
  function goToday() { selectDay(todayKey()); state.view = "day"; render(); }
  function shiftMonth(dir) {
    var m = state.monthCursor.m + dir, y = state.monthCursor.y;
    if (m < 0) { m = 11; y -= 1; } if (m > 11) { m = 0; y += 1; }
    state.monthCursor = { y: y, m: m }; state.monthDays = {}; render();
  }
  function getMonthKeys() {
    var prefix = state.monthCursor.y + "-" + pad(state.monthCursor.m + 1) + "-";
    return state.dayIndex.filter(function (k) { return k.indexOf(prefix) === 0; }).sort();
  }
  function computeMonthTotals() {
    var keys = getMonthKeys();
    var entregas = 0, taxas = 0, arrancada = 0;
    keys.forEach(function (k) {
      var d = state.monthDays[k] || (state.monthDays[k] = loadDay(k));
      entregas += d.entries.length;
      taxas += d.entries.reduce(function (s, e) { return s + (parseFloat(e.taxa) || 0); }, 0);
      arrancada += parseFloat(d.arrancada) || 0;
    });
    var avg = entregas > 0 ? (taxas + arrancada) / entregas : 0;
    var bestDay = null;
    keys.forEach(function (k) {
      var d = state.monthDays[k] || loadDay(k);
      var t = d.entries.reduce(function (s, e) { return s + (parseFloat(e.taxa) || 0); }, 0) + (parseFloat(d.arrancada) || 0);
      if (!bestDay || t > bestDay.total) bestDay = { key: k, total: t };
    });
    return { entregas: entregas, taxas: taxas, arrancada: arrancada, total: taxas + arrancada, diasAtivos: keys.length, avg: avg, bestDay: bestDay };
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
    else { document.exitFullscreen && document.exitFullscreen(); }
  }
  document.addEventListener("fullscreenchange", function () { state.isFullscreen = !!document.fullscreenElement; render(); });

  /* ===== BACKUP / EXPORT ===== */
  function exportBackup() {
    var all = {};
    state.dayIndex.forEach(function (k) { all[k] = loadDay(k); });
    var payload = { exportedAt: new Date().toISOString(), user: currentUser, days: all };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "comandas-delivery-backup-" + todayKey() + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast("Backup baixado com sucesso", "success");
    state.showSheet = false; render();
  }
  function exportCSV() {
    var keys = getMonthKeys();
    if (!keys.length) { showToast("Nenhum dado para exportar", "error"); return; }
    var rows = ["Data,Comanda,Taxa,Conferido,Nota,Arrancada,Total_Dia"];
    keys.forEach(function (k) {
      var d = state.monthDays[k] || loadDay(k);
      var arr = parseFloat(d.arrancada) || 0;
      var taxasSum = d.entries.reduce(function (s, e) { return s + (parseFloat(e.taxa) || 0); }, 0);
      var total = taxasSum + arr;
      if (d.entries.length === 0) {
        rows.push([k, "", "", "", "", arr, total].join(","));
      }
      d.entries.forEach(function (e) {
        rows.push([k, e.comanda, e.taxa, e.conferido ? "sim" : "nao", '"' + (e.nota || "").replace(/"/g, '""') + '"', "", total].join(","));
      });
    });
    var blob = new Blob(["\uFEFF" + rows.join("\n")], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var m = state.monthCursor.m + 1;
    a.href = url; a.download = "comandas-" + state.monthCursor.y + "-" + pad(m) + ".csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast("CSV exportado", "success");
    state.showSheet = false; render();
  }
  function importBackupFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        var days = parsed.days || parsed;
        var keys = Object.keys(days).filter(function (k) { return days[k]; });
        keys.forEach(function (k) { storeSet("day:" + k, JSON.stringify(days[k])); });
        var merged = state.dayIndex.slice();
        keys.forEach(function (k) { if (merged.indexOf(k) === -1) merged.push(k); });
        merged.sort(); saveDayIndex(merged); state.dayIndex = merged; state.monthDays = {};
        state.dayData = loadDay(state.selectedKey);
        showToast(keys.length + " dias importados", "success");
        state.showSheet = false; render();
      } catch (err) {
        showToast("Arquivo inválido", "error");
      }
    };
    reader.readAsText(file);
  }

  /* ===== LIVE SUMMARY UPDATE (no re-render) ===== */
  function updateSummaryLive() {
    var d = state.dayData;
    var entregas = d.entries.length;
    var conferidas = d.entries.filter(function (e) { return e.conferido; }).length;
    var taxas = d.entries.reduce(function (s, e) { return s + (parseFloat(e.taxa) || 0); }, 0);
    var arrancada = parseFloat(d.arrancada) || 0;
    var total = taxas + arrancada;
    var pct = entregas > 0 ? Math.round((conferidas / entregas) * 100) : 0;

    var el = document.getElementById("summary-entregas"); if (el) el.textContent = entregas;
    el = document.getElementById("summary-conferidas"); if (el) el.textContent = conferidas + "/" + entregas;
    el = document.getElementById("summary-taxas"); if (el) el.textContent = fmtBRL(taxas);
    el = document.getElementById("summary-arrancada"); if (el) el.textContent = fmtBRL(arrancada);
    el = document.getElementById("summary-total"); if (el) el.textContent = fmtBRL(total);
    el = document.getElementById("progress-fill"); if (el) { el.style.width = pct + "%"; el.classList.toggle("complete", pct === 100); }
    el = document.getElementById("progress-pct"); if (el) el.textContent = pct + "%";
  }

  /* ===== RENDER ===== */
  function render() {
    var app = document.getElementById("app");
    var themeIcon = getTheme() === "dark" ? "☀️" : "🌙";
    var html = '';

    // Header
    html += '<header>';
    html += '  <div class="header-left">';
    html += '    <div class="logo-mark">🛵</div>';
    html += '    <div class="brand-block"><div class="brand">Comandas Delivery</div>';
    html += '    <div class="brand-sub">' + esc(currentUser) + '</div></div>';
    html += '  </div>';
    html += '  <div class="header-right">';
    html += '    <button class="icon-btn" data-action="toggle-theme" title="Tema">' + themeIcon + '</button>';
    html += '    <button class="icon-btn" data-action="fullscreen" title="Tela cheia">' + (state.isFullscreen ? "🗗" : "⛶") + '</button>';
    html += '    <button class="icon-btn" data-action="show-sheet" title="Mais">⋮</button>';
    html += '  </div>';
    html += '</header>';

    // Backup bar removed — now toasts

    html += '<main>';
    if (state.view === "day") html += renderDayView();
    else html += renderMonthView();
    html += '</main>';

    // Tab bar
    html += '<nav class="tabbar">';
    html += '  <button class="tab' + (state.view === "day" ? " active" : "") + '" data-action="view-day"><span class="tab-icon">📋</span>Dia</button>';
    html += '  <button class="tab' + (state.view === "month" ? " active" : "") + '" data-action="view-month"><span class="tab-icon">📊</span>Mês</button>';
    html += '</nav>';

    // Action sheet
    if (state.showSheet) html += renderSheet();

    app.innerHTML = html;
    bindEvents();
  }

  function renderSheet() {
    var html = '';
    html += '<div class="sheet-overlay" data-action="close-sheet"></div>';
    html += '<div class="sheet">';
    html += '  <div class="sheet-handle"></div>';
    html += '  <div class="sheet-title">Opções</div>';
    html += '  <button class="sheet-btn" data-action="export"><span class="sheet-icon">💾</span> Exportar backup (JSON)</button>';
    html += '  <button class="sheet-btn" data-action="export-csv"><span class="sheet-icon">📄</span> Exportar CSV do mês</button>';
    html += '  <button class="sheet-btn" data-action="import"><span class="sheet-icon">📂</span> Importar backup</button>';
    html += '  <button class="sheet-btn danger" data-action="logout"><span class="sheet-icon">🚪</span> Sair (' + esc(currentUser) + ')</button>';
    html += '  <button class="sheet-cancel" data-action="close-sheet">Cancelar</button>';
    html += '</div>';
    return html;
  }

  function renderDayView() {
    var d = state.dayData;
    var entregas = d.entries.length;
    var conferidas = d.entries.filter(function (e) { return e.conferido; }).length;
    var taxas = d.entries.reduce(function (s, e) { return s + (parseFloat(e.taxa) || 0); }, 0);
    var arrancada = parseFloat(d.arrancada) || 0;
    var total = taxas + arrancada;
    var pct = entregas > 0 ? Math.round((conferidas / entregas) * 100) : 0;
    var isToday = state.selectedKey === todayKey();
    var allChecked = entregas > 0 && conferidas === entregas;

    var html = '';

    // Day nav
    html += '<div class="day-nav">';
    html += '  <button class="nav-btn" data-action="prev-day">‹</button>';
    html += '  <div class="day-nav-label"><div class="day-nav-date' + (isToday ? " is-today" : "") + '">' + esc(fmtDateLabel(state.selectedKey)) + '</div>';
    html += '  <input type="date" class="date-input" id="date-picker" value="' + esc(state.selectedKey) + '" /></div>';
    html += '  <button class="nav-btn" data-action="next-day">›</button>';
    html += '</div>';

    // Today button
    if (!isToday) {
      html += '<div style="text-align:center;margin-bottom:12px"><button class="nav-btn today-btn" data-action="go-today">↩ Hoje</button></div>';
    }

    // Search
    if (entregas > 3) {
      html += '<div class="search-wrap">';
      html += '  <input class="search-input" type="text" inputmode="numeric" placeholder="🔍 Buscar comanda nº..." id="search-input" value="' + esc(state.searchQuery) + '" />';
      if (state.searchQuery) html += '  <button class="search-clear" data-action="clear-search">✕</button>';
      html += '</div>';
    }

    // Card
    html += '<div class="card">';
    html += '  <div class="list-header"><span>Comanda</span><span>Taxa</span><span style="text-align:center">OK</span><span></span></div>';

    var filtered = d.entries;
    if (state.searchQuery) {
      var q = state.searchQuery;
      filtered = d.entries.filter(function (e) { return String(e.comanda).indexOf(q) !== -1; });
    }

    if (filtered.length === 0) {
      if (entregas === 0) {
        html += '<div class="empty-row"><span class="empty-icon">🛵</span>Nenhuma entrega lançada ainda.<br>Toque em "Nova comanda" para começar.</div>';
      } else {
        html += '<div class="empty-row">Nenhuma comanda encontrada para "' + esc(state.searchQuery) + '"</div>';
      }
    }

    filtered.forEach(function (e) {
      var expanded = state.expandedNotes[e.id];
      var hasNote = e.nota && e.nota.trim();
      html += '<div class="entry-row' + (e.conferido ? " conferido" : "") + (hasNote || expanded ? " has-note" : "") + (expanded ? " expanded" : "") + '" data-id="' + esc(e.id) + '">';
      html += '  <input class="comanda-field' + (e.conferido ? " riscado" : "") + '" type="number" inputmode="numeric" placeholder="nº" value="' + esc(e.comanda) + '" data-field="comanda" />';
      html += '  <div class="taxa-wrap"><span class="taxa-prefix">R$</span><input class="taxa-field" type="number" inputmode="decimal" placeholder="0,00" value="' + esc(e.taxa) + '" data-field="taxa" /></div>';
      html += '  <label class="check-wrap"><input type="checkbox" data-field="conferido" ' + (e.conferido ? "checked" : "") + ' /></label>';
      html += '  <button class="remove-btn" data-action="remove-entry">🗑</button>';
      if (hasNote || expanded) {
        html += '  <div class="note-cell"><input class="note-field" type="text" placeholder="Nota (opcional)..." value="' + esc(e.nota || "") + '" data-field="nota" /></div>';
      }
    });

    // Add + duplicate buttons
    html += '<button class="add-btn" data-action="add-entry">+ Nova comanda</button>';
    html += '<button class="dup-btn" data-action="dup-yesterday" ' + (entregas > 0 ? "" : "") + '>📋 Copiar comandas do dia anterior</button>';

    // Divider + arrancada
    html += '<div class="divider"></div>';
    html += '<div class="arrancada-row"><span class="arrancada-label">Arrancada do dia <span class="badge-info">fixa</span></span>';
    html += '  <div class="taxa-wrap"><span class="taxa-prefix">R$</span><input class="taxa-field" type="number" inputmode="decimal" id="arrancada-input" value="' + esc(d.arrancada) + '" /></div></div>';

    // Progress bar
    if (entregas > 0) {
      html += '<div class="progress-wrap">';
      html += '  <div class="progress-bar"><div class="progress-fill' + (allChecked ? " complete" : "") + '" id="progress-fill" style="width:' + pct + '%"></div></div>';
      html += '  <div class="progress-label"><span>' + conferidas + ' de ' + entregas + ' conferidas</span><span id="progress-pct">' + pct + '%</span></div>';
      html += '</div>';
      html += '<button class="dup-btn" data-action="mark-all" style="margin-top:8px">' + (allChecked ? "↩ Desmarcar todas" : "✓ Marcar todas conferidas") + '</button>';
    }

    // Summary
    html += '<div class="summary-block">';
    html += '  <div class="summary-line"><span>Entregas</span><span class="summary-strong" id="summary-entregas">' + entregas + '</span></div>';
    html += '  <div class="summary-line"><span>Conferidas</span><span class="summary-strong" id="summary-conferidas">' + conferidas + '/' + entregas + '</span></div>';
    html += '  <div class="summary-line"><span>Soma taxas</span><span class="summary-strong" id="summary-taxas">' + fmtBRL(taxas) + '</span></div>';
    html += '  <div class="summary-line"><span>Arrancada</span><span class="summary-strong" id="summary-arrancada">' + fmtBRL(arrancada) + '</span></div>';
    html += '  <div class="summary-line summary-total"><span>Total do dia</span><span id="summary-total">' + fmtBRL(total) + '</span></div>';
    if (entregas > 0) {
      var avg = (taxas + arrancada) / entregas;
      html += '  <div class="summary-line" style="margin-top:4px"><span>Ticket médio</span><span class="summary-strong">' + fmtBRL(avg) + '</span></div>';
    }
    html += '</div></div>';

    // Saving note
    html += '<div class="saving-note">';
    if (state.saving) { html += '<span class="saving-dot"></span> salvando...'; }
    else { html += '✓ salvo automaticamente'; }
    html += '</div>';

    return html;
  }

  function renderMonthView() {
    var t = computeMonthTotals();
    var keys = getMonthKeys();
    var dim = daysInMonth(state.monthCursor.y, state.monthCursor.m);
    var todayK = todayKey();
    var monthPrefix = state.monthCursor.y + "-" + pad(state.monthCursor.m + 1) + "-";
    var isCurrentMonth = todayK.indexOf(monthPrefix) === 0;

    var html = '';

    // Month nav
    html += '<div class="day-nav">';
    html += '  <button class="nav-btn" data-action="prev-month">‹</button>';
    html += '  <div class="month-label">' + MONTHS_PT[state.monthCursor.m] + ' ' + state.monthCursor.y + '</div>';
    html += '  <button class="nav-btn" data-action="next-month">›</button>';
    html += '</div>';

    // Big stats
    html += '<div class="big-stat-grid">';
    html += '  <div class="big-stat"><div class="big-stat-value">' + t.entregas + '</div><div class="big-stat-label">entregas no mês</div></div>';
    html += '  <div class="big-stat"><div class="big-stat-value">' + fmtBRL(t.total) + '</div><div class="big-stat-label">total recebido</div></div>';
    html += '</div>';

    // Extra stats
    if (t.entregas > 0) {
      html += '<div class="big-stat-grid">';
      html += '  <div class="big-stat"><div class="big-stat-value" style="font-size:20px">' + fmtBRL(t.avg) + '</div><div class="big-stat-label">ticket médio</div></div>';
      if (t.bestDay) {
        html += '  <div class="big-stat"><div class="big-stat-value" style="font-size:16px">' + esc(fmtDateLabel(t.bestDay.key)) + '</div><div class="big-stat-label">melhor dia · ' + fmtBRL(t.bestDay.total) + '</div></div>';
      } else {
        html += '  <div class="big-stat"><div class="big-stat-value" style="font-size:20px">' + t.diasAtivos + '</div><div class="big-stat-label">dias lançados</div></div>';
      }
      html += '</div>';
    }

    // Bar chart
    html += '<div class="chart-card">';
    html += '  <div class="chart-title">Total por dia</div>';
    html += '  <div class="chart-bars">';
    var maxVal = 0;
    var dayTotals = [];
    for (var day = 1; day <= dim; day++) {
      var k = monthPrefix + pad(day);
      var d = state.monthDays[k] || (state.monthDays[k] = loadDay(k));
      var sum = d.entries.reduce(function (s, e) { return s + (parseFloat(e.taxa) || 0); }, 0) + (parseFloat(d.arrancada) || 0);
      dayTotals.push(sum);
      if (sum > maxVal) maxVal = sum;
    }
    for (var day2 = 1; day2 <= dim; day2++) {
      var sum2 = dayTotals[day2 - 1];
      var h = maxVal > 0 ? (sum2 / maxVal) * 100 : 0;
      var isTodayBar = isCurrentMonth && day2 === parseInt(todayK.split("-")[2], 10);
      var hasData = sum2 > 0;
      var cls = "chart-bar" + (hasData ? " has-data" : "") + (isTodayBar ? " today" : "");
      var tooltip = hasData ? '<div class="chart-tooltip">' + day2 + ' · ' + fmtBRL(sum2) + '</div>' : '';
      html += '<div class="' + cls + '" style="height:' + (hasData ? Math.max(h, 4) : 2) + '%" data-day="' + day2 + '">' + tooltip + '</div>';
    }
    html += '  </div>';
    // Labels (show every 5th day)
    html += '  <div class="chart-labels">';
    for (var day3 = 1; day3 <= dim; day3++) {
      html += '<span>' + (day3 % 5 === 0 || day3 === 1 || day3 === dim ? day3 : "") + '</span>';
    }
    html += '  </div>';
    html += '</div>';

    // Summary card
    html += '<div class="card">';
    html += '  <div class="summary-line"><span>Dias lançados</span><span class="summary-strong">' + t.diasAtivos + '</span></div>';
    html += '  <div class="summary-line"><span>Soma taxas</span><span class="summary-strong">' + fmtBRL(t.taxas) + '</span></div>';
    html += '  <div class="summary-line"><span>Soma arrancadas</span><span class="summary-strong">' + fmtBRL(t.arrancada) + '</span></div>';
    if (t.entregas > 0) {
      html += '  <div class="summary-line"><span>Ticket médio</span><span class="summary-strong">' + fmtBRL(t.avg) + '</span></div>';
    }
    html += '  <div class="summary-line summary-total"><span>Total do mês</span><span>' + fmtBRL(t.total) + '</span></div>';
    html += '</div>';

    // Day list
    html += '<div class="day-list-title">Dias do mês</div><div class="day-list">';
    if (keys.length === 0) html += '<div class="empty-row"><span class="empty-icon">📅</span>Nenhum dia lançado neste mês ainda.</div>';
    keys.forEach(function (k) {
      var dd = state.monthDays[k] || loadDay(k);
      var entregas2 = dd.entries.length;
      var taxas2 = dd.entries.reduce(function (s, e) { return s + (parseFloat(e.taxa) || 0); }, 0);
      var arr = parseFloat(dd.arrancada) || 0;
      var isTodayItem = k === todayK;
      html += '<button class="day-list-item' + (isTodayItem ? " is-today" : "") + '" data-action="open-day" data-key="' + esc(k) + '">';
      html += '  <span class="day-list-date">' + esc(fmtDateLabel(k)) + (isTodayItem ? '<span class="today-badge">hoje</span>' : '') + '</span>';
      html += '  <span class="day-list-entregas">' + entregas2 + ' entregas</span>';
      html += '  <span class="day-list-total">' + fmtBRL(taxas2 + arr) + '</span>';
      html += '</button>';
    });
    html += '</div>';

    return html;
  }

  /* ===== BIND EVENTS ===== */
  function bindEvents() {
    var app = document.getElementById("app");

    // Views
    app.querySelectorAll('[data-action="view-day"]').forEach(function (el) { el.onclick = function () { state.view = "day"; render(); }; });
    app.querySelectorAll('[data-action="view-month"]').forEach(function (el) { el.onclick = function () { state.view = "month"; state.monthDays = {}; render(); }; });
    app.querySelectorAll('[data-action="toggle-theme"]').forEach(function (el) { el.onclick = toggleTheme; });
    app.querySelectorAll('[data-action="fullscreen"]').forEach(function (el) { el.onclick = toggleFullscreen; });
    app.querySelectorAll('[data-action="show-sheet"]').forEach(function (el) { el.onclick = function () { state.showSheet = true; render(); }; });

    // Sheet
    app.querySelectorAll('[data-action="close-sheet"]').forEach(function (el) { el.onclick = function () { state.showSheet = false; render(); }; });
    app.querySelectorAll('[data-action="export"]').forEach(function (el) { el.onclick = exportBackup; });
    app.querySelectorAll('[data-action="export-csv"]').forEach(function (el) { el.onclick = exportCSV; });
    app.querySelectorAll('[data-action="import"]').forEach(function (el) { el.onclick = function () { document.getElementById("import-file").click(); }; });
    app.querySelectorAll('[data-action="logout"]').forEach(function (el) { el.onclick = function () { state.showSheet = false; if (confirm("Sair da conta?")) logout(); }; });

    var fileInput = document.getElementById("import-file");
    if (fileInput) fileInput.onchange = function (e) { var f = e.target.files[0]; if (f) importBackupFile(f); e.target.value = ""; };

    // Day nav
    app.querySelectorAll('[data-action="prev-day"]').forEach(function (el) { el.onclick = function () { shiftDay(-1); }; });
    app.querySelectorAll('[data-action="next-day"]').forEach(function (el) { el.onclick = function () { shiftDay(1); }; });
    app.querySelectorAll('[data-action="go-today"]').forEach(function (el) { el.onclick = goToday; });
    app.querySelectorAll('[data-action="prev-month"]').forEach(function (el) { el.onclick = function () { shiftMonth(-1); }; });
    app.querySelectorAll('[data-action="next-month"]').forEach(function (el) { el.onclick = function () { shiftMonth(1); }; });

    var datePicker = document.getElementById("date-picker");
    if (datePicker) datePicker.onchange = function (e) { selectDay(e.target.value); };

    // Search
    var searchInput = document.getElementById("search-input");
    if (searchInput) {
      searchInput.oninput = function () { state.searchQuery = searchInput.value; renderDayViewPartial(); };
      // preserve focus after render
      setTimeout(function () { var s = document.getElementById("search-input"); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }, 0);
    }
    app.querySelectorAll('[data-action="clear-search"]').forEach(function (el) { el.onclick = function () { state.searchQuery = ""; render(); }; });

    // Entries
    app.querySelectorAll('[data-action="add-entry"]').forEach(function (el) { el.onclick = addEntry; });
    app.querySelectorAll('[data-action="remove-entry"]').forEach(function (el) { el.onclick = function () { removeEntry(el.closest(".entry-row").getAttribute("data-id")); }; });
    app.querySelectorAll('[data-action="dup-yesterday"]').forEach(function (el) { el.onclick = duplicateYesterday; });
    app.querySelectorAll('[data-action="mark-all"]').forEach(function (el) { el.onclick = markAllConferido; });

    app.querySelectorAll(".entry-row input").forEach(function (el) {
      var row = el.closest(".entry-row");
      var id = row.getAttribute("data-id");
      var field = el.getAttribute("data-field");
      if (field === "conferido") { el.onchange = function () { updateEntry(id, field, el.checked); render(); }; }
      else if (field === "nota") { el.onblur = function () { updateEntry(id, field, el.value); }; }
      else {
        el.onblur = function () { updateEntry(id, field, el.value); };
        el.onkeydown = function (ev) { if (ev.key === "Enter") el.blur(); };
      }
    });

    // Arrancada
    var arrancadaInput = document.getElementById("arrancada-input");
    if (arrancadaInput) {
      arrancadaInput.onblur = function () { setArrancada(arrancadaInput.value); };
      arrancadaInput.onkeydown = function (ev) { if (ev.key === "Enter") arrancadaInput.blur(); };
    }

    // Open day from month view
    app.querySelectorAll('[data-action="open-day"]').forEach(function (el) { el.onclick = function () { selectDay(el.getAttribute("data-key")); state.view = "day"; render(); }; });

    // Chart bar click → open day
    app.querySelectorAll(".chart-bar.has-data").forEach(function (el) {
      el.onclick = function () {
        var day = parseInt(el.getAttribute("data-day"), 10);
        var k = state.monthCursor.y + "-" + pad(state.monthCursor.m + 1) + "-" + pad(day);
        selectDay(k); state.view = "day"; render();
      };
    });
  }

  // partial re-render of just the day view card area
  function renderDayViewPartial() {
    // simplest: full re-render but keep search focus
    render();
    setTimeout(function () {
      var s = document.getElementById("search-input");
      if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
    }, 0);
  }

  // Keyboard shortcuts
  document.addEventListener("keydown", function (ev) {
    if (!currentUser) return;
    if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA") return;
    if (ev.key === "ArrowLeft" && state.view === "day") shiftDay(-1);
    else if (ev.key === "ArrowRight" && state.view === "day") shiftDay(1);
    else if (ev.key === "n" || ev.key === "N") { if (state.view === "day") addEntry(); }
    else if (ev.key === "t" || ev.key === "T") toggleTheme();
  });

  init();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
